<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Stream Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: #fff;
    width: 320px;
    overflow: hidden;
  }
  .card {
    background: rgba(20, 22, 31, 0.85);
    border-left: 4px solid #9146ff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    backdrop-filter: blur(6px);
  }
  .card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a7a9be;
    margin-bottom: 4px;
  }
  .card .value { font-size: 16px; line-height: 1.4; }
  .viewers { font-size: 36px; font-weight: 800; color: #9146ff; }
  .dot { display:inline-block; width:10px; height:10px; background:#ff0000; border-radius:50%; margin-right:6px; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .song-current { font-size:14px; color:#1db954; margin-bottom:4px; }
  .song-note { font-size:12px; color:#6a6c82; }
  .prestream { text-align:center; }
  .prestream-timer { font-size:38px; font-weight:800; letter-spacing:2px; color:#9146ff; margin:6px 0; }
  .prestream-label { font-size:14px; color:#a7a9be; }
</style>
</head>
<body>
  <div id="root"></div>
<script>
var API = 'http://127.0.0.1:8765/overlay/api';
var PRESTREAM_MIN = 5;

async function load() {
  try {
    var r = await fetch(API);
    var d = await r.json();
    var h = '';

    if (d.stream && d.stream.live && d.stream.started_at) {
      var elapsed = (Date.now() / 1000) - Date.parse(d.stream.started_at) / 1000;
      var remain = PRESTREAM_MIN * 60 - elapsed;
      if (remain > 0) {
        window._prestreamEnd = Date.parse(d.stream.started_at) / 1000 + PRESTREAM_MIN * 60;
        h += '<div class="card prestream"><h3>🎬 Стрим скоро начнётся</h3>';
        h += '<div class="prestream-timer" id="prestreamTimer">--:--</div>';
        h += '<div class="prestream-label">приносим покой и уют</div></div>';
      }
    }

    if (d.stream && d.stream.live) {
      h += '<div class="card"><h3><span class="dot"></span>Зрители</h3>';
      h += '<div class="viewers">' + (d.stream.viewers || 0) + '</div></div>';
    } else {
      h += '<div class="card"><h3>Статус</h3><div class="value">⚪ Офлайн</div></div>';
    }

    if (d.song && d.song.current) {
      h += '<div class="card"><h3>🎵 Сейчас играет</h3>';
      h += '<div class="song-current">' + esc(d.song.current.title) + '</div>';
      h += '<div class="song-note">заказал: ' + esc(d.song.current.requester) + '</div></div>';
    }

    document.getElementById('root').innerHTML = h;
  } catch (e) { /* ignore */ }
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

load();
setInterval(load, 5000);
setInterval(function () {
  var el = document.getElementById('prestreamTimer');
  if (!el || !window._prestreamEnd) return;
  var remain = Math.floor(window._prestreamEnd - Date.now() / 1000);
  if (remain <= 0) { el.parentElement.style.display = 'none'; return; }
  var m = Math.floor(remain / 60);
  var sec = remain % 60;
  el.textContent = (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
}, 1000);
</script>
</body>
</html>

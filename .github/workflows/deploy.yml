name: Deploy to hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files via FTP
        env:
          FTP_USER: u3662487
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          base="ftp://server286.hosting.reg.ru/www/dendich.online"
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              echo "upload $rel"
              curl --fail -u "$FTP_USER:$FTP_PASS" \
                --ftp-create-dirs \
                -T "$f" "$base/$rel"
            done
          echo "deployed"
